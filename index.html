<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE DREAMER｜夢想家香氛店</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap');
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f3eee7;color:#332d27;font-family:"Noto Serif TC",serif}
nav{position:sticky;top:0;z-index:10;background:rgba(243,238,231,.96);border-bottom:1px solid #b8aa99;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:"Cormorant Garamond",serif;font-size:27px;letter-spacing:3px}
nav a{color:inherit;text-decoration:none;margin-left:25px;font-size:14px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;min-height:560px}
.hero img{width:100%;height:100%;object-fit:cover;min-height:560px}
.hero-copy{display:flex;flex-direction:column;justify-content:center;padding:60px 8%;background:#eee7de}
.kicker{letter-spacing:5px;font-size:15px;color:#7d6d5d}
h1{font-family:"Cormorant Garamond",serif;font-size:clamp(60px,8vw,110px);font-weight:500;letter-spacing:5px;line-height:.9;margin:20px 0}
h2{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-size:38px;font-weight:500;letter-spacing:3px}
.rule{width:130px;border-top:1px solid #756657;margin:22px 0}
.copy{line-height:2;font-size:15px;color:#5d5147}
.button{display:inline-block;margin-top:24px;padding:13px 30px;border:1px solid #54483e;border-radius:2px;color:#fff;background:#3c352e;text-decoration:none;width:max-content}
section{padding:90px 7%;border-bottom:1px solid #c9bcae}
.intro{text-align:center;max-width:760px;margin:auto}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:35px;margin-top:45px}
.card{background:#e9e1d8;border:1px solid #bdb0a1;padding:18px}
.card img{display:block;width:100%;height:auto}
.card h3{text-align:center;font-weight:500;letter-spacing:2px;margin:16px 0 4px}
footer{background:#302a25;color:#eee4d8;padding:45px 7%;text-align:center;letter-spacing:2px}
@media(max-width:800px){
 .hero{grid-template-columns:1fr}
 .hero img{min-height:360px;height:360px}
 .hero-copy{min-height:430px}
 nav{padding:15px 5%}
 nav div:last-child{display:none}
 .plans{grid-template-columns:1fr}
 section{padding:60px 5%}
}
</style>
</head>
<body>
<nav>
  <div class="brand">THE DREAMER</div>
  <div>
    <a href="#home">首頁</a>
    <a href="#shop">店舖 & 住宅</a>
  </div>
</nav>

<main id="home">
<section class="hero" style="padding:0;border:0">
  <img src="storefront.jpg" alt="THE DREAMER 夢想家香氛店店面外觀">
  <div class="hero-copy">
    <div class="kicker">SLEEP & FRAGRANCE</div>
    <h1>THE<br>DREAMER</h1>
    <div class="rule"></div>
    <h2>夢想家香氛店</h2>
    <p class="copy">位於奧克利商業街的一間兩層樓街屋。<br>一樓是香氛店，二樓是我們的家。<br>香氣與生活，在這裡共同呼吸。</p>
    <a class="button" href="#shop">探索店舖</a>
  </div>
</section>

<section id="shop">
  <div class="intro">
    <div class="kicker">THE SPACE</div>
    <h2>店舖 & 住宅格局</h2>
    <div class="rule" style="margin:20px auto"></div>
    <p class="copy">一間兩層樓的街屋，一樓為對外營業的睡眠香氛店，二樓則為私人住宅。以下為店舖與住宅的完整平面配置。</p>
  </div>
  <div class="plans">
    <div class="card">
      <img src="floorplan.jpg" alt="THE DREAMER 一樓店舖與二樓住宅平面圖">
      <h3>一樓【店舖】・二樓【住宅】</h3>
    </div>
  </div>
</section>
</main>

<footer>
  THE DREAMER　·　NATURAL ESSENTIAL OILS　·　RELAXATION & SLEEP
</footer>
</body>
</html>
